<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nishchay Defence Academy — NDA, CDS, SSB preparation, notes, and mentorship by aspirants for aspirants." />
    <title>Nishchay - Defence Preparation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      /* Initial loading screen — replaced automatically when React mounts */
      #nishchay-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #050A0F;
        z-index: 9999;
        gap: 24px;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #nishchay-loader.fade-out { opacity: 0; pointer-events: none; }
      #nishchay-loader .shield {
        width: 56px; height: 56px;
        border: 2px solid rgba(45,106,79,0.4);
        border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        animation: pulse-shield 2s ease-in-out infinite;
      }
      #nishchay-loader .shield svg { color: #2D6A4F; }
      #nishchay-loader .brand {
        font-family: system-ui, -apple-system, sans-serif;
        color: white; font-size: 28px; font-weight: 900;
        letter-spacing: 6px; text-transform: uppercase;
      }
      #nishchay-loader .sub {
        font-family: system-ui, -apple-system, sans-serif;
        color: rgba(255,255,255,0.3); font-size: 9px; font-weight: 800;
        letter-spacing: 4px; text-transform: uppercase;
      }
      #nishchay-loader .bar-track {
        width: 180px; height: 3px; border-radius: 4px;
        background: rgba(255,255,255,0.06); overflow: hidden;
      }
      #nishchay-loader .bar-fill {
        width: 100%; height: 100%; border-radius: 4px;
        background: linear-gradient(90deg, transparent, #2D6A4F, transparent);
        animation: shimmer-bar 1.4s ease-in-out infinite;
      }
      @keyframes shimmer-bar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes pulse-shield {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant loading screen — auto-replaced by React -->
      <div id="nishchay-loader">
        <div class="shield">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
        </div>
        <div class="brand">NISHCHAY</div>
        <div class="sub">Defence Preparation</div>
        <div class="bar-track"><div class="bar-fill"></div></div>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
