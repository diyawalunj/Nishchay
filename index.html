<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Nishchay Defence — NDA, CDS preparation, notes, and mentorship by aspirants for aspirants." />
    <title>Nishchay Defence</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      /* Smooth fade-in only on screen */
      @media screen {
        #root {
          opacity: 0;
          animation: root-fade-in 0.5s ease-out 0.05s forwards;
        }
        @keyframes root-fade-in {
          from { opacity: 0; transform: translateY(6px); }
          to   { opacity: 1; transform: translateY(0); }
        }
      }
      @media print {
        #root {
          opacity: 1 !important;
          visibility: visible !important;
          display: block !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
